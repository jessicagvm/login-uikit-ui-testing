name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # === Build ===
      - name: Build for Testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project login-swiftui-uitesting.xcodeproj \
            -scheme "login-swiftui-uitesting" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath Build.xcresult

      # === Test ===
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project login-swiftui-uitesting.xcodeproj \
            -scheme "login-swiftui-uitesting" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult

      # === Upload Results ===
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-xcresult
          path: TestResults.xcresult

      - name: Export xcresult JSON
        if: always()
        run: |
          mkdir -p parsed
          xcrun xcresulttool get --path TestResults.xcresult --format json > parsed/result.json || true

      - name: Upload parsed JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-json
          path: parsed/result.json
